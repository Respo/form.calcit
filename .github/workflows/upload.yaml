name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Validate Calcit project
      run: |
        set -euo pipefail
        test "$(calcit --version)" = "0.27.0"
        test ! -e compact.cirru
        test ! -e package.cirru
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit fix --workflow strict --verify --format edn
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-public \
          --ns form.comp.container \
          --ns form.config \
          --ns form.core \
          --ns form.main \
          --ns form.schema \
          --ns form.types \
          --ns form.updater \
          --summary-only
        calcit calcit.cirru analyze check-types --summary-only
        calcit calcit.cirru analyze weak-types \
          --only schema-dynamic,unresolved-type-slot,code-dynamic \
          --intent unresolved \
          --summary-only
        calcit calcit.cirru analyze dynamic-methods --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru analyze deprecated --summary-only
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Validate documentation
      run: calcit docs check-md README.md --snapshot calcit.cirru --failures-only

    - name: Build frontend with CDN URLs
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"
        calcit calcit.cirru js
        yarn vite build --base="$base_url"
        node --test scripts/form-regression.test.mjs

    - name: Check COS credentials
      id: cos-credentials
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "::warning::COS upload skipped: configure COS_BUCKET, COS_SECRET_ID, COS_SECRET_KEY."
        else
          echo "::error::COS credentials are required for production deployment."
          exit 1
        fi

    - name: Upload and verify frontend assets on COS
      if: steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Verify runner rsync
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        /usr/bin/rsync --version

    - name: Configure verified SSH host
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        printf '%s\n' 'tiye.me ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfDrFyoH0+6TL2+xhosnON6f0+/m9Iz8ydJLWMQQzsm' > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Deploy web assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        /usr/bin/rsync -avzr --progress \
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
          dist/* "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"
