name: Prepare guarded Form storage restore ordering
on:
  push:
    branches: [prepare/form-storage-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Original formal dependency graph
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
      - name: Full source transaction and original before-after gates
        run: node prepare-storage.mjs
      - uses: actions/upload-artifact@v7.0.1
        if: success()
        with:
          name: accepted-source
          path: prepared-source/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: success()
        with:
          name: accepted-runtime
          path: runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: diagnostics
          path: acceptance/
          if-no-files-found: error
